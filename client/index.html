<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    CSP (API.md §6.6): restringe para onde a página pode falar.
    connect-src libera a API local (http/ws) e qualquer endpoint HTTPS/WSS
    (o alvo em produção usa wss://...). 'unsafe-inline' em script/style é
    exigido pelo Vite (HMR/react-refresh) e pelo Tailwind.
  -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://127.0.0.1:8000 ws://127.0.0.1:8000 http://localhost:8000 ws://localhost:8000 https: wss:; img-src 'self' data:; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" />
  <title>PENT.IA — Pentest Chess</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
